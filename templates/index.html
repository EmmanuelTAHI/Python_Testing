<!DOCTYPE html>
<html lang="fr" data-theme="black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUDLFT Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-base-100" style="font-family: 'JetBrains Mono', monospace;">
    <!-- Header Hero Section -->
    <div class="hero min-h-screen bg-gradient-to-br from-primary to-secondary">
        <div class="hero-content text-center">
            <div class="max-w-md">
                <h1 class="text-4xl font-bold text-primary-content mb-6">
                    Bienvenue sur le Portail GUDLFT !
                </h1>
                <p class="text-lg text-primary-content opacity-90 mb-8">
                    Portail de réservation pour les compétitions de clubs
                </p>

                <!-- Login Card -->
                <div class="card bg-base-200 shadow-2xl w-full">
                    <div class="card-body">
                        <h2 class="card-title text-2xl font-bold text-base-content mb-4">
                            Connexion Secrétaire
                        </h2>

                        <form action="showSummary" method="post" class="space-y-4">
                            <div class="form-control">
                                <label class="label" for="email">
                                    <span class="label-text font-semibold">Email :</span>
                                </label>
                                <input
                                    type="email"
                                    name="email"
                                    id="email"
                                    required
                                    class="input input-bordered input-primary w-full"
                                    placeholder="votre@email.com"
                                />
                            </div>
                            <button type="submit" class="btn btn-primary w-full">
                                Se connecter
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Public Links -->
                <div class="mt-8">
                    <div class="card bg-base-300 shadow-lg">
                        <div class="card-body text-center">
                            <h3 class="card-title text-base-content mb-4">Pages publiques :</h3>
                            <a href="{{ url_for('displayPoints') }}" class="btn btn-outline">
                                Voir le tableau des points
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
